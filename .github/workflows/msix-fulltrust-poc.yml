name: Firefox MSIX full-trust sandbox PoC

on:
  workflow_dispatch:
  push:
    branches:
      - msix-fulltrust-ctf
    paths:
      - .github/workflows/msix-fulltrust-poc.yml
      - scripts/Run-Poc.ps1
      - src/driver.cpp
      - src/payload.cpp
      - src/poc_context.h

permissions:
  contents: read

jobs:
  prove-boundary-crossing:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: Check out the PoC
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            src

      - name: Run the content-process proof
        id: poc
        shell: pwsh
        run: ./scripts/Run-Poc.ps1 -ArtifactRoot ./artifacts

      - name: Publish the verdict in the run summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ./artifacts/summary.md) {
            Get-Content ./artifacts/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            "# Firefox MSIX full-trust launcher PoC`n`nThe harness did not produce a summary." | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firefox-msix-fulltrust-evidence
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
